name: Port tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  portable-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libsdl2-dev pkg-config
      - name: Run ROM-free platform tests
        run: make -C tools/porttest check
